services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: b2vec
      POSTGRES_USER: b2vec
      POSTGRES_PASSWORD: b2vec_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: b2vec
      DB_USER: b2vec
      DB_PASSWORD: b2vec_dev
      CELERY_BROKER_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://host.docker.internal:11435
    depends_on:
      - db
      - redis
    volumes:
      - static_files:/app/staticfiles
      - ./exports:/app/exports
    restart: unless-stopped

  celery-worker:
    build: .
    command: celery -A config worker -l info --concurrency=2
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: b2vec
      DB_USER: b2vec
      DB_PASSWORD: b2vec_dev
      CELERY_BROKER_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://host.docker.internal:11435
    depends_on:
      - db
      - redis
    restart: unless-stopped

  atlas:
    build:
      context: .
      dockerfile: atlas.Dockerfile
    ports:
      - "5055:5055"
    volumes:
      - ./atlas_data.parquet:/data/atlas_data.parquet:ro
    command: ["atlas_data.parquet", "--text", "description", "--x", "projection_x", "--y", "projection_y", "--neighbors", "neighbors"]
    restart: unless-stopped

volumes:
  pgdata:
  static_files:
