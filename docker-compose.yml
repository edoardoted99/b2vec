services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: b2vec
      POSTGRES_USER: b2vec
      POSTGRES_PASSWORD: b2vec_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  atlas:
    build:
      context: .
      dockerfile: atlas.Dockerfile
    ports:
      - "5055:5055"
    volumes:
      - ./atlas_data.parquet:/data/atlas_data.parquet:ro
    command: ["atlas_data.parquet", "--text", "description", "--x", "projection_x", "--y", "projection_y", "--neighbors", "neighbors"]
    restart: unless-stopped

volumes:
  pgdata:
