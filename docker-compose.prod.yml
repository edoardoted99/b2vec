services:
  web:
    build: .
    env_file: .env.prod
    environment:
      DB_HOST: host.docker.internal
      CELERY_BROKER_URL: redis://redis:6379/0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
    volumes:
      - static_files:/app/staticfiles
      - ./exports:/app/exports
    restart: unless-stopped

  celery-worker:
    build: .
    command: celery -A config worker -l info --concurrency=2
    env_file: .env.prod
    environment:
      DB_HOST: host.docker.internal
      CELERY_BROKER_URL: redis://redis:6379/0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/app/staticfiles:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    depends_on:
      - web
    restart: unless-stopped

  atlas:
    build:
      context: .
      dockerfile: atlas.Dockerfile
    volumes:
      - ./atlas_data.parquet:/data/atlas_data.parquet:ro
    command: ["atlas_data.parquet", "--text", "description", "--x", "projection_x", "--y", "projection_y", "--neighbors", "neighbors"]
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    volumes:
      - open_webui_data:/app/backend/data
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11435
      - WEBUI_SECRET_KEY=b2vec-openwebui-experiment
      - ENABLE_SIGNUP=true
      - DEFAULT_MODELS=qwen3.5:35b
      - WEBUI_NAME=B2Vec
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - web
    restart: unless-stopped

volumes:
  static_files:
  certbot_www:
  certbot_conf:
  open_webui_data:
