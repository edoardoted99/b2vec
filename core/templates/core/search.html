{% extends 'core/base.html' %}

{% block content %}
<div class="row mt-3">
    <div class="col-lg-8 mx-auto">
        <h2 class="mb-4">Search</h2>

        <form id="search-form" class="mb-4">
            <div class="input-group input-group-lg">
                <input type="text" id="search-input" class="form-control" placeholder="Company name, URL, or semantic description..." autofocus>
                <button type="submit" class="btn btn-primary">Search</button>
            </div>
        </form>

        <div id="text-results" style="display:none;">
            <h5 id="text-header" class="mb-3"></h5>
            <div id="text-list"></div>
        </div>

        <div id="semantic-results" style="display:none;">
            <h5 id="semantic-header" class="mb-3"></h5>
            <div id="semantic-list"></div>
        </div>

        <div id="semantic-loading" style="display:none;" class="text-center py-3">
            <div class="spinner-border spinner-border-sm text-primary" role="status"></div>
            <span class="ms-2 text-muted">Semantic search in progress...</span>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', function () {
    const form = document.getElementById('search-form');
    const input = document.getElementById('search-input');
    const textResults = document.getElementById('text-results');
    const textList = document.getElementById('text-list');
    const textHeader = document.getElementById('text-header');
    const semanticResults = document.getElementById('semantic-results');
    const semanticList = document.getElementById('semantic-list');
    const semanticHeader = document.getElementById('semantic-header');
    const semanticLoading = document.getElementById('semantic-loading');

    const params = new URLSearchParams(window.location.search);
    if (params.get('q')) {
        input.value = params.get('q');
        doSearch(params.get('q'));
    }

    form.addEventListener('submit', function (e) {
        e.preventDefault();
        const query = input.value.trim();
        if (!query) return;
        history.replaceState(null, '', `?q=${encodeURIComponent(query)}`);
        doSearch(query);
    });

    function renderCard(r, showSimilarity) {
        const card = document.createElement('div');
        card.className = 'card mb-2';
        let domain = '';
        try { domain = r.url ? new URL(r.url).hostname : ''; } catch {}
        card.innerHTML = `
            <div class="card-body py-2 px-3 d-flex justify-content-between align-items-center">
                <div class="d-flex align-items-center gap-2">
                    ${domain ? `<img src="https://www.google.com/s2/favicons?domain=${domain}&sz=32" alt="" width="20" height="20" class="rounded">` : ''}
                    <div>
                        <a href="/company/${r.id}/" class="fw-bold text-decoration-none">${r.name}</a>
                        <span class="text-muted ms-2">${r.industry}</span>
                        ${r.url ? `<br><small><a href="${r.url}" target="_blank" rel="noopener">${r.url}</a></small>` : ''}
                    </div>
                </div>
                <div class="text-end">
                    ${showSimilarity && r.similarity != null ? `<span class="badge bg-primary">${r.similarity}%</span>` : ''}
                    ${r.x != null ? `<br><a href="/map/?highlight=${r.id}" class="small">Show on map</a>` : ''}
                </div>
            </div>
        `;
        return card;
    }

    function doSearch(query) {
        // Reset
        textResults.style.display = 'none';
        textList.innerHTML = '';
        semanticResults.style.display = 'none';
        semanticList.innerHTML = '';
        semanticLoading.style.display = 'block';

        // Text search (instant)
        fetch(`/api/text-search/?q=${encodeURIComponent(query)}&n=10`)
            .then(r => r.json())
            .then(data => {
                if (data.results && data.results.length > 0) {
                    textHeader.textContent = `${data.results.length} name/URL matches`;
                    data.results.forEach(r => textList.appendChild(renderCard(r, false)));
                    textResults.style.display = 'block';
                }
            })
            .catch(() => {});

        // Semantic search (slow)
        fetch(`/api/search/?q=${encodeURIComponent(query)}&n=20`)
            .then(r => r.json())
            .then(data => {
                semanticLoading.style.display = 'none';
                if (data.error) {
                    semanticHeader.textContent = 'Error: ' + data.error;
                    semanticResults.style.display = 'block';
                    return;
                }
                semanticHeader.textContent = `${data.results.length} semantic results`;
                data.results.forEach(r => semanticList.appendChild(renderCard(r, true)));
                semanticResults.style.display = 'block';
            })
            .catch(() => {
                semanticLoading.style.display = 'none';
                semanticHeader.textContent = 'Semantic search failed.';
                semanticResults.style.display = 'block';
            });
    }
});
</script>
{% endblock %}
